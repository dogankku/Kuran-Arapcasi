name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
          # E-posta/şifre girişi (Supabase projesi: ayet-hafizasi).
          # Publishable anahtar tarayıcıda kullanılmak üzere tasarlanmıştır ve herkese açık olabilir;
          # veriler Row Level Security ile korunur. Secret anahtar ASLA buraya yazılmaz.
          NEXT_PUBLIC_SUPABASE_URL: https://eplrzbiavujewdjazoes.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wOS-kOoyVyGsRqVgPWYtUA_cekja1W4

      - name: Fix SPA routing for GitHub Pages
        run: |
          cat > out/404.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8">
          <title>Ayet Hafızası</title>
          <script>
            var path = window.location.pathname;
            // If path has no trailing slash, add it — GitHub Pages serves directory/index.html
            if (!path.endsWith('/')) {
              window.location.replace(path + '/' + window.location.search + window.location.hash);
            } else {
              // Unknown page — go home
              window.location.replace('/Kuran-Arapcasi/');
            }
          </script>
          </head><body></body></html>
          EOF

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out

