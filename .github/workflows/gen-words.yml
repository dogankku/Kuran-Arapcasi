name: Ek kelime verisini üret

on:
  push:
    branches: [gen-words]
    paths: ["scripts/gen_extended_words.py", ".github/workflows/gen-words.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gen_extended_words.py
      - name: Sonucu dala kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/extended_words.json
          git commit -m "Ek kelime verisi üretildi (Quranic Arabic Corpus + Quran.com)" || echo "değişiklik yok"
          git push
